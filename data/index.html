<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoRa Sniffer</title>
    <style>
        body { font-family: monospace; background: #111; color: #0f0; margin: 1rem; }
        h1 { color: #0f0; }
        fieldset { border: 1px solid #0f0; margin-bottom: 1rem; padding: 0.5rem; }
        label { display: inline-block; width: 100px; }
        input, select, button { background: #222; color: #0f0; border: 1px solid #0f0; margin: 2px; }
        button { cursor: pointer; }
        button:disabled, input:disabled, select:disabled { opacity: 0.5; cursor: not-allowed; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #0f0; padding: 2px 4px; text-align: left; }
        #log { height: 300px; overflow-y: auto; }
        #status { color: #0f0; font-size: 12px; margin-bottom: 8px; }
        .scan-row-current { background: #252; font-weight: bold; }
        .scan-row-hit { background: #333; color: #ff0; }
        #scanProgress { width: 100%; height: 8px; border: 1px solid #0f0; margin-top: 4px; }
        #scanProgressBar { height: 100%; background: #0f0; width: 0%; transition: width 0.2s; }
    </style>
</head>
<body>
    <h1>LoRa Sniffer (Heltec V3)</h1>

    <div id="status">…</div>

    <fieldset>
        <legend>Режим сканирования</legend>
        <button id="scanBtn" onclick="toggleScan()">Начать сканирование</button>
        <div id="scanStatus" style="margin-top:8px; font-size:12px;"></div>
        <div id="scanProgress"><div id="scanProgressBar"></div></div>
        <div id="scanList" style="margin-top:8px;"></div>
    </fieldset>

    <fieldset id="configFieldset">
        <legend>Параметры радио</legend>
        <label>Частота (МГц):</label><input id="freq" value="868.0"><br>
        <label>BW (кГц):</label>
        <select id="bw">
            <option>125.0</option><option>250.0</option><option>500.0</option>
        </select><br>
        <label>SF:</label>
        <select id="sf">
            <option>7</option><option>8</option><option>9</option><option>10</option><option>11</option><option>12</option>
        </select><br>
        <label>CR (4/..):</label>
        <select id="cr"><option>5</option><option>6</option><option>7</option><option>8</option></select><br>
        <label>Sync word (hex):</label><input id="sync" value="12"><br>
        <label>Preamble:</label><input id="preamble" value="8"><br>
        <label>CRC:</label>
        <select id="crc"><option value="1">On</option><option value="0">Off</option></select><br>
        <label>IQ inverted:</label>
        <select id="iq"><option value="0">Нет</option><option value="1">Да</option></select><br>
        <button onclick="applyConfig()">Применить</button>
    </fieldset>

    <fieldset>
        <legend>Запись</legend>
        <button onclick="fetch('/record/start',{method:'POST'})">Начать запись</button>
        <button onclick="fetch('/record/stop',{method:'POST'})">Остановить</button>
        <a href="/download"><button>Скачать дамп</button></a>
        <button onclick="fetch('/clear',{method:'POST'}).then(()=>location.reload())">Очистить</button>
    </fieldset>

    <fieldset>
        <legend>Последние пакеты</legend>
        <div id="log">
            <table>
                <thead><tr><th>Время (мс)</th><th>RSSI</th><th>SNR</th><th>Len</th><th>ASCII</th><th>HEX</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </fieldset>

    <script>
        const tbody = document.getElementById('tbody');
        const CONFIG_FIELDS = ['freq','bw','sf','cr','sync','preamble','crc','iq'];

        // Флаг: пользователь менял поля и они ещё не отправлены на плату.
        // Пока true — периодическое обновление статуса НЕ трогает поля ввода.
        let formDirty = false;

        // ----- WebSocket -----
        const ws = new WebSocket(`ws://${location.host}/ws`);
        ws.onmessage = (ev) => {
            const p = JSON.parse(ev.data);
            const row = document.createElement('tr');
            row.innerHTML = `<td>${p.t}</td><td>${p.rssi.toFixed(1)}</td><td>${p.snr.toFixed(1)}</td>
                             <td>${p.len}</td><td>${p.ascii}</td><td>${p.hex}</td>`;
            tbody.prepend(row);
            if (tbody.children.length > 200) tbody.lastChild.remove();
        };

        // ----- Заполнение формы из ответа /config -----
        function fillForm(c) {
            document.getElementById('freq').value     = c.freq;
            document.getElementById('bw').value       = c.bw;
            document.getElementById('sf').value       = c.sf;
            document.getElementById('cr').value       = c.cr;
            document.getElementById('sync').value     = c.sync;
            document.getElementById('preamble').value = c.preamble;
            document.getElementById('crc').value      = c.crc;
            document.getElementById('iq').value       = c.iq;
        }

        function updateStatus(c) {
            document.getElementById('status').textContent =
                `Пакетов: ${c.packets} | Запись: ${c.recording ? 'REC' : 'Idle'} | Сканирование: ${c.scanning ? 'ON' : 'OFF'}`;

            // Блокировка полей во время сканирования
            CONFIG_FIELDS.forEach(id => document.getElementById(id).disabled = c.scanning);
        }

        // Первичная загрузка — заполняем поля и статус
        async function initialLoad() {
            try {
                const r = await fetch('/config');
                const c = await r.json();
                fillForm(c);
                updateStatus(c);
            } catch (e) { console.error('initialLoad', e); }
        }

        // Периодическое обновление — только статус, поля не трогаем
        async function refreshStatus() {
            try {
                const r = await fetch('/config');
                const c = await r.json();
                updateStatus(c);
            } catch (e) { /* молча */ }
        }

        // Отслеживаем изменения в полях — чтобы не перетирать их
        CONFIG_FIELDS.forEach(id => {
            const el = document.getElementById(id);
            el.addEventListener('input',  () => { formDirty = true; });
            el.addEventListener('change', () => { formDirty = true; });
        });

        // ----- Применение конфигурации -----
        async function applyConfig() {
            const fd = new FormData();
            CONFIG_FIELDS.forEach(id => fd.append(id, document.getElementById(id).value));

            try {
                const r = await fetch('/config', { method: 'POST', body: fd });
                const t = await r.text();
                alert(t);
                formDirty = false;                 // сброс флага
                // После сохранения — подтягиваем актуальные значения с платы
                const r2 = await fetch('/config');
                const c2 = await r2.json();
                fillForm(c2);
                updateStatus(c2);
            } catch (e) {
                alert('Ошибка: ' + e);
            }
        }

        // ----- Сканирование -----
        let scanActive = false;

        async function toggleScan() {
            if (scanActive) {
                await fetch('/scan/stop', {method:'POST'});
            } else {
                await fetch('/scan/start', {method:'POST'});
            }
            formDirty = false;
            await refreshStatus();
            await refreshScanStatus();
        }

        async function refreshScanStatus() {
            try {
                const r = await fetch('/scan/status');
                const s = await r.json();
                scanActive = s.active;

                document.getElementById('scanBtn').textContent =
                    scanActive ? 'Остановить сканирование' : 'Начать сканирование';

                if (scanActive) {
                    const pct = Math.min(100, Math.floor(s.elapsed * 100 / s.duration));
                    const cur = s.presets[s.current];
                    document.getElementById('scanStatus').innerHTML =
                        `Пресет <b>${s.current + 1}/${s.total}</b>: ${cur.name}<br>` +
                        `Пакетов на этом пресете: <b>${cur.hits}</b>`;
                    document.getElementById('scanProgressBar').style.width = pct + '%';

                    let html = '<table style="font-size:11px">' +
                        '<tr><th>#</th><th>Пресет</th><th>МГц</th><th>BW</th><th>SF</th><th>Sync</th><th>Хиты</th></tr>';
                    for (let i = 0; i < s.presets.length; i++) {
                        const p = s.presets[i];
                        let cls = '';
                        if (i === s.current) cls = 'scan-row-current';
                        else if (p.hits > 0) cls = 'scan-row-hit';
                        html += `<tr class="${cls}"><td>${i+1}</td><td>${p.name}</td>` +
                                `<td>${p.freq}</td><td>${p.bw}</td><td>${p.sf}</td>` +
                                `<td>0x${p.sync}</td><td>${p.hits}</td></tr>`;
                    }
                    html += '</table>';
                    document.getElementById('scanList').innerHTML = html;
                } else {
                    document.getElementById('scanStatus').innerHTML = '';
                    document.getElementById('scanProgressBar').style.width = '0%';

                    let hitCount = 0;
                    let summary = '<table style="font-size:11px"><tr><th>Пресет</th><th>Найдено пакетов</th></tr>';
                    for (let i = 0; i < s.presets.length; i++) {
                        if (s.presets[i].hits > 0) {
                            hitCount++;
                            summary += `<tr class="scan-row-hit"><td>${s.presets[i].name}</td><td>${s.presets[i].hits}</td></tr>`;
                        }
                    }
                    summary += '</table>';
                    document.getElementById('scanList').innerHTML =
                        hitCount > 0 ? '<b>Найдено пресетов: ' + hitCount + '</b>' + summary : '';
                }
            } catch (e) { /* молча */ }
        }

        // ----- Старт -----
        initialLoad();
        refreshScanStatus();
        setInterval(refreshStatus, 3000);        // статус — можно часто
        setInterval(refreshScanStatus, 1000);    // сканирование — раз в секунду
    </script>
</body>
</html>
